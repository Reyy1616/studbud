<!doctype html>
<html lang="en" class="h-full bg-zinc-950 text-zinc-100">
<head>
  <meta charset="utf-8">
  <title>StudBud - AI Knowledge Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    /* Custom scrollbar in dark gold */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #d97706; }
  </style>
</head>
<body class="h-full flex flex-col bg-zinc-950 text-zinc-100 antialiased selection:bg-amber-500 selection:text-black">


  <!-- Background Subtle Glow -->
  <div class="fixed inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-amber-900/15 via-zinc-950/80 to-zinc-950 pointer-events-none"></div>

  <!-- Login Modal (lecturer / developer access) -->
  <div id="login-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
    <div class="w-full max-w-sm bg-zinc-900 border border-amber-900/40 rounded-2xl p-6 shadow-2xl">
      <div class="flex items-center gap-3 mb-4">
        <div class="h-10 w-10 rounded-xl bg-amber-950/60 border border-amber-900/40 flex items-center justify-center text-amber-400">
          <i data-lucide="shield-check" class="w-5 h-5"></i>
        </div>
        <div>
          <h3 class="text-base font-bold text-white">Lecturer / Developer Access</h3>
          <p class="text-xs text-zinc-400">Enter the access key to unlock ingestion.</p>
        </div>
      </div>
      <form id="login-form" class="space-y-3">
        <input id="login-input" type="password" autocomplete="off"
               placeholder="Access key"
               class="w-full bg-zinc-950/60 border border-amber-900/30 rounded-xl px-4 py-2.5 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-amber-500/60 focus:ring-2 focus:ring-amber-500/20 transition-all">
        <div id="login-status" class="text-xs text-red-400 min-h-[1em]"></div>
        <div class="flex items-center justify-end gap-2 pt-1">
          <button type="button" id="login-cancel" class="text-xs font-semibold px-4 py-2.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-300 transition-all">Cancel</button>
          <button type="submit" id="login-submit" class="text-xs font-semibold px-4 py-2.5 rounded-xl bg-gradient-to-r from-amber-600 to-yellow-600 hover:from-amber-500 hover:to-yellow-500 text-zinc-950 shadow-md shadow-amber-600/20 transition-all disabled:opacity-50 flex items-center gap-2">
            <i data-lucide="unlock" class="w-3.5 h-3.5"></i>
            Unlock
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Chat History Drawer -->
  <div id="history-overlay" class="hidden fixed inset-0 z-40 bg-black/60 backdrop-blur-sm"></div>
  <aside id="history-panel"
         class="fixed top-0 left-0 z-50 h-full w-80 max-w-[85vw] bg-zinc-900 border-r border-amber-900/40 shadow-2xl transform -translate-x-full transition-transform duration-200 flex flex-col">
    <div class="flex items-center justify-between px-4 py-4 border-b border-amber-900/30">
      <div class="flex items-center gap-2 text-sm font-bold text-white">
        <i data-lucide="history" class="w-4 h-4 text-amber-400"></i>
        Chat History
      </div>
      <button id="history-close" title="Close" class="p-1.5 rounded-lg text-zinc-400 hover:text-amber-400 hover:bg-zinc-800 transition-all">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <div class="p-3 border-b border-amber-900/20">
      <button id="new-chat-btn"
              class="w-full text-xs font-semibold px-4 py-2.5 rounded-xl bg-gradient-to-r from-amber-600 to-yellow-600 hover:from-amber-500 hover:to-yellow-500 text-zinc-950 shadow-md shadow-amber-600/20 transition-all flex items-center justify-center gap-2">
        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
        New chat
      </button>
    </div>

    <div id="history-list" class="flex-1 overflow-y-auto p-2 space-y-1">
      <!-- Conversation entries injected here -->
    </div>

    <div class="px-4 py-3 border-t border-amber-900/20 flex items-center justify-between">
      <span class="text-[11px] text-zinc-500">Saved in this browser</span>
      <button id="clear-all-btn" class="text-[11px] font-semibold text-zinc-500 hover:text-red-400 flex items-center gap-1 transition-colors">
        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
        Clear all
      </button>
    </div>
  </aside>

  <!-- Main Container -->
  <div class="relative z-10 max-w-4xl w-full mx-auto flex flex-col h-full px-4 py-6 md:py-8">
    
    <!-- Top Header -->
    <header class="mb-6 flex items-center justify-between pb-4 border-b border-amber-900/30">
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-amber-600 via-amber-500 to-yellow-400 flex items-center justify-center shadow-lg shadow-amber-500/20 ring-1 ring-amber-300/30">
          <i data-lucide="sparkles" class="w-5 h-5 text-zinc-950"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
            StudBud
            <span class="text-[10px] font-semibold uppercase tracking-wider bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded-full">v1.0</span>
          </h1>
          <p class="text-xs text-zinc-400">AI Knowledge Assistant</p>
        </div>
      </div>
      
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2 text-xs text-zinc-400 bg-zinc-900/90 border border-amber-900/30 px-3 py-1.5 rounded-full shadow-inner">
          <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse shadow-[0_0_8px_rgba(245,158,11,0.8)]"></span>
          <span>SSE Streaming Active</span>
        </div>
        <button id="history-btn" title="Chat history" class="p-2 rounded-xl bg-zinc-900/80 hover:bg-zinc-800 text-zinc-400 hover:text-amber-400 border border-amber-900/30 transition-all">
          <i data-lucide="history" class="w-4 h-4"></i>
        </button>
        <a href="/about" title="About Us" class="p-2 rounded-xl bg-zinc-900/80 hover:bg-zinc-800 text-zinc-400 hover:text-amber-400 border border-amber-900/30 transition-all">
          <i data-lucide="info" class="w-4 h-4"></i>
        </a>
        <button id="admin-btn" title="Lecturer / Developer access" class="p-2 rounded-xl bg-zinc-900/80 hover:bg-zinc-800 text-zinc-400 hover:text-amber-400 border border-amber-900/30 transition-all">
          <i data-lucide="lock" class="w-4 h-4"></i>
        </button>
        <button id="clear-btn" title="New chat" class="p-2 rounded-xl bg-zinc-900/80 hover:bg-zinc-800 text-zinc-400 hover:text-amber-400 border border-amber-900/30 transition-all">
          <i data-lucide="square-pen" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <!-- Upload Card (visible only to authenticated lecturers/developers) -->
    <div id="upload-card" class="hidden mb-6 bg-zinc-900/60 border border-amber-900/30 rounded-2xl p-4 shadow-xl backdrop-blur-md">
      <div class="flex items-center justify-between mb-2">
        <label for="upload-input" class="text-xs font-semibold uppercase tracking-wider text-amber-400/90 flex items-center gap-1.5">
          <i data-lucide="file-up" class="w-4 h-4 text-amber-400"></i>
          Ingest Knowledge Base
          <span class="ml-1 text-[10px] font-semibold uppercase tracking-wider bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded-full">Lecturer / Developer</span>
        </label>
        <div class="flex items-center gap-3">
          <span class="text-[11px] text-zinc-500">Supports .txt, .md, .markdown, .pdf</span>
          <button type="button" id="logout-btn" title="Lock ingestion" class="text-[11px] font-semibold text-zinc-400 hover:text-amber-400 flex items-center gap-1 transition-colors">
            <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
            Lock
          </button>
        </div>
      </div>

      <form id="upload-form" class="flex items-center gap-2">
        <div class="relative flex-1">
          <input type="file" id="upload-input" accept=".txt,.md,.markdown,.pdf"
                 class="block w-full text-xs text-zinc-400
                        file:mr-3 file:py-2 file:px-4
                        file:rounded-xl file:border-0
                        file:text-xs file:font-semibold
                        file:bg-amber-950/60 file:text-amber-300
                        hover:file:bg-amber-900/50
                        file:cursor-pointer file:transition-colors
                        bg-zinc-950/60 border border-amber-900/20 rounded-xl p-1 focus:outline-none focus:border-amber-500/50">
        </div>
        <button type="submit" id="upload-btn"
                class="text-xs font-semibold px-4 py-2.5 rounded-xl bg-gradient-to-r from-amber-600 to-yellow-600 hover:from-amber-500 hover:to-yellow-500 active:from-amber-700 active:to-yellow-700 text-zinc-950 shadow-md shadow-amber-600/20 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2 whitespace-nowrap">
          <span>Upload & Ingest</span>
          <i data-lucide="arrow-up-right" class="w-3.5 h-3.5"></i>
        </button>
      </form>
      <div id="upload-status" class="text-xs text-amber-400/90 mt-2.5 font-mono min-h-[1em] transition-all"></div>
    </div>

    <!-- Conversation Window -->
    <div class="flex-1 flex flex-col min-h-0 bg-zinc-900/40 border border-amber-900/30 rounded-2xl p-4 md:p-6 shadow-2xl relative overflow-hidden backdrop-blur-md mb-4">
      <div id="messages" class="flex-1 overflow-y-auto space-y-4 pr-1">
        <!-- Empty state placeholder -->
        <div id="empty-state" class="h-full flex flex-col items-center justify-center text-center p-8 text-zinc-500">
          <div class="w-12 h-12 rounded-2xl bg-zinc-900 border border-amber-900/30 flex items-center justify-center mb-3 text-amber-500 shadow-lg shadow-amber-500/5">
            <i data-lucide="message-square" class="w-6 h-6"></i>
          </div>
          <p class="text-sm font-medium text-zinc-300">No messages yet</p>
          <p class="text-xs text-zinc-500 max-w-xs mt-1">Upload a document above or start asking questions about your corpus.</p>
        </div>
      </div>
    </div>

    <!-- Compose Section -->
    <form id="chat-form" class="relative flex items-center gap-2 bg-zinc-900/90 border border-amber-900/40 rounded-2xl p-2 shadow-xl focus-within:border-amber-500/60 focus-within:ring-2 focus-within:ring-amber-500/20 transition-all">
      <input id="chat-input" type="text" autocomplete="off"
             placeholder="Ask anything about your uploaded corpus..."
             class="flex-1 bg-transparent px-4 py-2 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none">
      <button type="submit" id="send-btn"
              class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-amber-600 to-yellow-600 hover:from-amber-500 hover:to-yellow-500 active:from-amber-700 active:to-yellow-700 text-zinc-950 font-semibold text-sm shadow-md shadow-amber-600/20 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
        <span>Send</span>
        <i data-lucide="send" class="w-4 h-4"></i>
      </button>
    </form>

  </div>

<script>
// Initialize Lucide Icons
lucide.createIcons();

// ---- Admin / ingestion access control ----
const $uploadCard  = document.getElementById("upload-card");
const $adminBtn    = document.getElementById("admin-btn");
const $loginModal  = document.getElementById("login-modal");
const $loginForm   = document.getElementById("login-form");
const $loginInput  = document.getElementById("login-input");
const $loginStatus = document.getElementById("login-status");
const $loginSubmit = document.getElementById("login-submit");
const $loginCancel = document.getElementById("login-cancel");
const $logoutBtn   = document.getElementById("logout-btn");

function setAuthenticated(isAuth) {
  $uploadCard.classList.toggle("hidden", !isAuth);
  $adminBtn.classList.toggle("text-amber-400", isAuth);
  $adminBtn.title = isAuth ? "Ingestion unlocked" : "Lecturer / Developer access";
  const icon = $adminBtn.querySelector("[data-lucide]");
  if (icon) {
    icon.setAttribute("data-lucide", isAuth ? "lock-open" : "lock");
    lucide.createIcons();
  }
}

async function refreshSession() {
  try {
    const res = await fetch("/api/session");
    const body = await res.json().catch(() => ({}));
    setAuthenticated(!!body.authenticated);
  } catch {
    setAuthenticated(false);
  }
}

function openLogin() {
  $loginStatus.textContent = "";
  $loginInput.value = "";
  $loginModal.classList.remove("hidden");
  $loginInput.focus();
}
function closeLogin() {
  $loginModal.classList.add("hidden");
}

$adminBtn.addEventListener("click", () => {
  // If already unlocked, the button acts as a quick lock toggle.
  if (!$uploadCard.classList.contains("hidden")) {
    doLogout();
  } else {
    openLogin();
  }
});
$loginCancel.addEventListener("click", closeLogin);
$loginModal.addEventListener("click", (e) => { if (e.target === $loginModal) closeLogin(); });

$loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const token = $loginInput.value;
  if (!token) return;
  $loginSubmit.disabled = true;
  $loginStatus.textContent = "";
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token }),
    });
    if (res.ok) {
      setAuthenticated(true);
      closeLogin();
    } else {
      const body = await res.json().catch(() => ({}));
      $loginStatus.textContent = body.detail || `Login failed (HTTP ${res.status})`;
    }
  } catch (err) {
    $loginStatus.textContent = err.message;
  } finally {
    $loginSubmit.disabled = false;
  }
});

async function doLogout() {
  try { await fetch("/api/logout", { method: "POST" }); } catch {}
  setAuthenticated(false);
}
if ($logoutBtn) $logoutBtn.addEventListener("click", doLogout);

refreshSession();

// State management
let history = [];

const $messages = document.getElementById("messages");
const $form     = document.getElementById("chat-form");
const $input    = document.getElementById("chat-input");
const $sendBtn  = document.getElementById("send-btn");
const $clearBtn = document.getElementById("clear-btn");

// ---- Persistent chat history (localStorage, per browser) ----
const STORE_KEY = "studbud_conversations";
let conversations = [];   // [{ id, title, created, messages: [{role, content, sources?}] }]
let currentId = null;

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    conversations = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(conversations)) conversations = [];
  } catch {
    conversations = [];
  }
}
function saveStore() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(conversations)); } catch {}
}
function currentConvo() {
  return conversations.find(c => c.id === currentId) || null;
}
function makeTitle(text) {
  const t = (text || "").trim().replace(/\s+/g, " ");
  return t ? (t.length > 40 ? t.slice(0, 40) + "…" : t) : "New chat";
}
function newConversation() {
  const convo = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                  title: "New chat", created: Date.now(), messages: [] };
  conversations.unshift(convo);
  currentId = convo.id;
  saveStore();
  return convo;
}
// Persist a completed turn (user + assistant, with optional sources) into the active convo
function recordTurn(userText, assistantText, sources) {
  let convo = currentConvo();
  if (!convo) convo = newConversation();
  convo.messages.push({ role: "user", content: userText });
  convo.messages.push({ role: "assistant", content: assistantText, sources: sources || [] });
  if (convo.title === "New chat") convo.title = makeTitle(userText);
  convo.created = Date.now();
  // Move active convo to the top (most recent first)
  conversations = conversations.filter(c => c.id !== convo.id);
  conversations.unshift(convo);
  saveStore();
  renderHistoryList();
}

// Hide empty state on first message
const observer = new MutationObserver(() => {
  const emptyState = document.getElementById("empty-state");
  if (emptyState && $messages.children.length > 1) {
    emptyState.remove();
  }
});
observer.observe($messages, { childList: true });

function appendMessage(role, text) {
  const wrap = document.createElement("div");
  const isUser = role === "user";
  
  wrap.className = isUser
    ? "p-4 bg-amber-500/10 border border-amber-500/20 rounded-2xl ml-auto max-w-[85%] text-zinc-100 shadow-sm"
    : "p-4 bg-zinc-900/90 border border-amber-900/30 rounded-2xl mr-auto max-w-[90%] text-zinc-200 shadow-sm";

  const header = document.createElement("div");
  header.className = "flex items-center gap-2 mb-2 text-xs font-semibold uppercase tracking-wider";
  
  if (isUser) {
    header.className += " text-amber-400 justify-end";
    header.innerHTML = `<span>You</span><i data-lucide="user" class="w-3.5 h-3.5"></i>`;
  } else {
    header.className += " text-zinc-400";
    header.innerHTML = `<i data-lucide="bot" class="w-3.5 h-3.5 text-amber-400"></i><span>StudBud AI</span>`;
  }

  const body = document.createElement("div");
  body.className = "whitespace-pre-wrap text-sm leading-relaxed";
  body.textContent = text;

  wrap.appendChild(header);
  wrap.appendChild(body);
  $messages.appendChild(wrap);
  
  lucide.createIcons();
  $messages.scrollTop = $messages.scrollHeight;
  return body;
}

function appendSources(hits) {
  if (!hits || !hits.length) return;
  const wrap = document.createElement("div");
  wrap.className = "text-xs text-zinc-400 mt-2 p-3 bg-zinc-950/80 border border-amber-900/30 rounded-xl space-y-1.5 max-w-[90%]";
  
  const title = document.createElement("div");
  title.className = "font-medium text-amber-400 flex items-center gap-1.5 mb-1";
  title.innerHTML = `<i data-lucide="layers" class="w-3.5 h-3.5"></i> Referenced Sources:`;
  wrap.appendChild(title);

  hits.forEach(h => {
    const chip = document.createElement("div");
    chip.className = "inline-flex items-center gap-2 bg-zinc-900 border border-amber-900/30 px-2.5 py-1 rounded-md text-[11px] mr-1.5 mb-1 font-mono text-zinc-300";
    chip.innerHTML = `<span class="text-amber-400">${h.filename}</span> <span class="text-zinc-600">•</span> chunk ${h.chunk_index} <span class="text-zinc-600">•</span> score ${h.score}`;
    wrap.appendChild(chip);
  });

  $messages.appendChild(wrap);
  lucide.createIcons();
  $messages.scrollTop = $messages.scrollHeight;
}

const EMPTY_STATE_HTML = `
  <div id="empty-state" class="h-full flex flex-col items-center justify-center text-center p-8 text-zinc-500">
    <div class="w-12 h-12 rounded-2xl bg-zinc-900 border border-amber-900/30 flex items-center justify-center mb-3 text-amber-500 shadow-lg shadow-amber-500/5">
      <i data-lucide="message-square" class="w-6 h-6"></i>
    </div>
    <p class="text-sm font-medium text-zinc-300">No messages yet</p>
    <p class="text-xs text-zinc-500 max-w-xs mt-1">Upload a document above or start asking questions about your corpus.</p>
  </div>
`;

function showEmptyState() {
  $messages.innerHTML = EMPTY_STATE_HTML;
  lucide.createIcons();
}

// Rebuild the transcript + in-memory history from a saved conversation
function renderConversation(convo) {
  $messages.innerHTML = "";
  history = [];
  if (!convo || !convo.messages.length) {
    showEmptyState();
    return;
  }
  const es = document.getElementById("empty-state");
  if (es) es.remove();
  for (const m of convo.messages) {
    appendMessage(m.role, m.content);
    if (m.role === "assistant" && m.sources && m.sources.length) {
      appendSources(m.sources);
    }
    history.push({ role: m.role, content: m.content });
  }
  $messages.scrollTop = $messages.scrollHeight;
}

// Start a brand-new empty conversation in the UI
function startNewChat() {
  newConversation();
  renderConversation(null);
  renderHistoryList();
}

function relativeTime(ts) {
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h ago";
  const d = Math.floor(h / 24);
  return d + "d ago";
}

function renderHistoryList() {
  const $list = document.getElementById("history-list");
  $list.innerHTML = "";
  if (!conversations.length) {
    $list.innerHTML = `<p class="text-xs text-zinc-500 text-center py-6">No saved chats yet.</p>`;
    return;
  }
  for (const c of conversations) {
    const isActive = c.id === currentId;
    const row = document.createElement("div");
    row.className = "group flex items-center gap-2 rounded-xl px-3 py-2 cursor-pointer border transition-all "
      + (isActive
          ? "bg-amber-500/10 border-amber-500/30"
          : "bg-zinc-900/40 border-transparent hover:bg-zinc-800/60 hover:border-amber-900/30");

    const main = document.createElement("div");
    main.className = "flex-1 min-w-0";
    main.innerHTML =
      `<div class="text-xs font-medium truncate ${isActive ? "text-amber-300" : "text-zinc-200"}">${escapeHtml(c.title)}</div>
       <div class="text-[10px] text-zinc-500">${relativeTime(c.created)} · ${c.messages.length ? (c.messages.length/2|0) + " msg" : "empty"}</div>`;
    main.addEventListener("click", () => {
      currentId = c.id;
      renderConversation(c);
      renderHistoryList();
      closeHistory();
    });

    const del = document.createElement("button");
    del.className = "shrink-0 p-1 rounded-lg text-zinc-500 hover:text-red-400 hover:bg-zinc-800 opacity-0 group-hover:opacity-100 transition-all";
    del.title = "Delete chat";
    del.innerHTML = `<i data-lucide="trash-2" class="w-3.5 h-3.5"></i>`;
    del.addEventListener("click", (e) => {
      e.stopPropagation();
      deleteConversation(c.id);
    });

    row.appendChild(main);
    row.appendChild(del);
    $list.appendChild(row);
  }
  lucide.createIcons();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, ch =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

function deleteConversation(id) {
  conversations = conversations.filter(c => c.id !== id);
  saveStore();
  if (currentId === id) {
    if (conversations.length) {
      currentId = conversations[0].id;
      renderConversation(currentConvo());
    } else {
      startNewChat();
      return;
    }
  }
  renderHistoryList();
}

// ---- History drawer open/close ----
const $historyBtn     = document.getElementById("history-btn");
const $historyPanel   = document.getElementById("history-panel");
const $historyOverlay = document.getElementById("history-overlay");
const $historyClose   = document.getElementById("history-close");
const $newChatBtn     = document.getElementById("new-chat-btn");
const $clearAllBtn    = document.getElementById("clear-all-btn");

function openHistory() {
  renderHistoryList();
  $historyOverlay.classList.remove("hidden");
  $historyPanel.classList.remove("-translate-x-full");
}
function closeHistory() {
  $historyOverlay.classList.add("hidden");
  $historyPanel.classList.add("-translate-x-full");
}
$historyBtn.addEventListener("click", openHistory);
$historyClose.addEventListener("click", closeHistory);
$historyOverlay.addEventListener("click", closeHistory);
$newChatBtn.addEventListener("click", () => { startNewChat(); closeHistory(); });
$clearAllBtn.addEventListener("click", () => {
  if (!conversations.length) return;
  if (!confirm("Delete all saved chats? This cannot be undone.")) return;
  conversations = [];
  saveStore();
  startNewChat();
});

// "New chat" quick action in the header (was: clear)
$clearBtn.addEventListener("click", startNewChat);

// Bootstrap: load saved chats and show the most recent (or a fresh one)
loadStore();
if (conversations.length) {
  currentId = conversations[0].id;
  renderConversation(currentConvo());
} else {
  newConversation();
  showEmptyState();
}
renderHistoryList();

$form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = $input.value.trim();
  if (!message) return;
  $input.value = "";
  $sendBtn.disabled = true;

  appendMessage("user", message);
  const replyBody = appendMessage("assistant", "");

  let assistantText = "";
  let turnSources = [];
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, history }),
    });
    if (!res.ok || !res.body) {
      replyBody.textContent = `[error] HTTP ${res.status}`;
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let sep;
      while ((sep = buf.indexOf("\n\n")) !== -1) {
        const frame = buf.slice(0, sep);
        buf = buf.slice(sep + 2);
        const lines = frame.split("\n");
        let event = "message", data = "";
        for (const line of lines) {
          if (line.startsWith("event: ")) event = line.slice(7);
          else if (line.startsWith("data: ")) data = line.slice(6);
        }
        let payload = {};
        try { payload = JSON.parse(data); } catch {}
        if (event === "token") {
          assistantText += payload.text || "";
          replyBody.textContent = assistantText;
          $messages.scrollTop = $messages.scrollHeight;
        } else if (event === "sources") {
          turnSources = payload.hits || [];
          appendSources(turnSources);
        } else if (event === "error") {
          replyBody.textContent = "[error] " + (payload.message || "unknown");
        }
      }
    }
  } catch (err) {
    replyBody.textContent = "[error] " + err.message;
  } finally {
    if (assistantText) {
      history.push({ role: "user", content: message });
      history.push({ role: "assistant", content: assistantText });
      recordTurn(message, assistantText, turnSources);
    }
    $sendBtn.disabled = false;
    $input.focus();
  }
});

// Upload Handler
const $uploadForm   = document.getElementById("upload-form");
const $uploadInput  = document.getElementById("upload-input");
const $uploadBtn    = document.getElementById("upload-btn");
const $uploadStatus = document.getElementById("upload-status");

$uploadForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const file = $uploadInput.files[0];
  if (!file) return;
  const data = new FormData();
  data.append("file", file);
  $uploadBtn.disabled = true;
  $uploadStatus.textContent = `Uploading ${file.name}...`;
  try {
    const res = await fetch("/api/upload", { method: "POST", body: data });
    const body = await res.json().catch(() => ({}));
    if (res.status === 403 || res.status === 401) {
      $uploadStatus.textContent = "[locked] Ingestion is restricted to lecturers and developers.";
      setAuthenticated(false);
    } else if (!res.ok) {
      $uploadStatus.textContent = `[error] ${body.detail || res.status}`;
    } else {
      $uploadStatus.textContent =
        `Ingested ${body.filename} (${body.bytes} bytes). Now searchable.`;
      $uploadInput.value = "";
    }
  } catch (err) {
    $uploadStatus.textContent = "[error] " + err.message;
  } finally {
    $uploadBtn.disabled = false;
  }
});
</script>
