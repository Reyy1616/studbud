<!doctype html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="utf-8">
  <title>StudBud</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    /* Custom scrollbar for message container */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Main Container -->
  <div class="max-w-4xl w-full mx-auto flex flex-col h-full px-4 py-6 md:py-8">
    
    <!-- Top Header -->
    <header class="mb-6 flex items-center justify-between pb-4 border-b border-slate-800/80">
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/20 ring-1 ring-white/20">
          <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
            StudBud
            <span class="text-[10px] font-semibold uppercase tracking-wider bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-2 py-0.5 rounded-full">v1.0</span>
          </h1>
          <p class="text-xs text-slate-400">AI Knowledge Assistant</p>
        </div>
      </div>
      <div class="flex items-center gap-2 text-xs text-slate-400 bg-slate-900/80 border border-slate-800 px-3 py-1.5 rounded-full shadow-inner">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>SSE Streaming Active</span>
      </div>
    </header>

    <!-- Upload Card -->
    <div class="mb-6 bg-slate-900/60 border border-slate-800 rounded-2xl p-4 shadow-xl backdrop-blur-sm">
      <div class="flex items-center justify-between mb-2">
        <label for="upload-input" class="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
          <i data-lucide="file-up" class="w-4 h-4 text-indigo-400"></i>
          Ingest Knowledge Base
        </label>
        <span class="text-[11px] text-slate-500">Supports .txt, .md, .markdown, .pdf</span>
      </div>

      <form id="upload-form" class="flex items-center gap-2">
        <div class="relative flex-1">
          <input type="file" id="upload-input" accept=".txt,.md,.markdown,.pdf"
                 class="block w-full text-xs text-slate-400
                        file:mr-3 file:py-2 file:px-4
                        file:rounded-xl file:border-0
                        file:text-xs file:font-semibold
                        file:bg-slate-800 file:text-indigo-300
                        hover:file:bg-slate-700/80
                        file:cursor-pointer file:transition-colors
                        bg-slate-950/50 border border-slate-800/80 rounded-xl p-1 focus:outline-none">
        </div>
        <button type="submit" id="upload-btn"
                class="text-xs font-medium px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white shadow-md shadow-indigo-600/20 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2 whitespace-nowrap">
          <span>Upload & Ingest</span>
          <i data-lucide="arrow-up-right" class="w-3.5 h-3.5"></i>
        </button>
      </form>
      <div id="upload-status" class="text-xs text-indigo-400 mt-2.5 font-mono min-h-[1em] transition-all"></div>
    </div>

    <!-- Conversation Window -->
    <div class="flex-1 flex flex-col min-h-0 bg-slate-900/40 border border-slate-800/80 rounded-2xl p-4 md:p-6 shadow-2xl relative overflow-hidden backdrop-blur-sm mb-4">
      <div id="messages" class="flex-1 overflow-y-auto space-y-4 pr-1">
        <!-- Empty state placeholder (disappears when messages are added) -->
        <div id="empty-state" class="h-full flex flex-col items-center justify-center text-center p-8 text-slate-500">
          <div class="w-12 h-12 rounded-2xl bg-slate-800/50 border border-slate-700/50 flex items-center justify-center mb-3 text-slate-400">
            <i data-lucide="message-square" class="w-6 h-6"></i>
          </div>
          <p class="text-sm font-medium text-slate-300">No messages yet</p>
          <p class="text-xs text-slate-500 max-w-xs mt-1">Upload a document above or start asking questions about your corpus.</p>
        </div>
      </div>
    </div>

    <!-- Compose Section -->
    <form id="chat-form" class="relative flex items-center gap-2 bg-slate-900/80 border border-slate-800 rounded-2xl p-2 shadow-xl focus-within:border-indigo-500/50 focus-within:ring-2 focus-within:ring-indigo-500/20 transition-all">
      <input id="chat-input" type="text" autocomplete="off"
             placeholder="Ask anything about your uploaded corpus..."
             class="flex-1 bg-transparent px-4 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none">
      <button type="submit" id="send-btn"
              class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium text-sm shadow-md shadow-indigo-600/20 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
        <span>Send</span>
        <i data-lucide="send" class="w-4 h-4"></i>
      </button>
    </form>

  </div>

<script>
// Initialize Lucide Icons
lucide.createIcons();

// Hide empty state on first message
const observer = new MutationObserver(() => {
  const emptyState = document.getElementById("empty-state");
  if (emptyState && $messages.children.length > 1) {
    emptyState.remove();
  }
});
observer.observe(document.getElementById("messages"), { childList: true });

// Conversation state lives on the client. Each request re-sends the raw
// history; the server is stateless between requests — same trade-off as
// most modern web apps.
const history = [];

const $messages = document.getElementById("messages");
const $form     = document.getElementById("chat-form");
const $input    = document.getElementById("chat-input");
const $sendBtn  = document.getElementById("send-btn");

function appendMessage(role, text) {
  const wrap = document.createElement("div");
  const isUser = role === "user";
  
  wrap.className = isUser
    ? "p-4 bg-indigo-600/10 border border-indigo-500/20 rounded-2xl ml-auto max-w-[85%] text-slate-100 shadow-sm"
    : "p-4 bg-slate-900 border border-slate-800 rounded-2xl mr-auto max-w-[90%] text-slate-200 shadow-sm";

  const header = document.createElement("div");
  header.className = "flex items-center gap-2 mb-2 text-xs font-semibold uppercase tracking-wider";
  
  if (isUser) {
    header.className += " text-indigo-400 justify-end";
    header.innerHTML = `<span>You</span><i data-lucide="user" class="w-3.5 h-3.5"></i>`;
  } else {
    header.className += " text-slate-400";
    header.innerHTML = `<i data-lucide="bot" class="w-3.5 h-3.5 text-indigo-400"></i><span>StudBud AI</span>`;
  }

  const body = document.createElement("div");
  body.className = "whitespace-pre-wrap text-sm leading-relaxed";
  body.textContent = text;

  wrap.appendChild(header);
  wrap.appendChild(body);
  $messages.appendChild(wrap);
  
  // Refresh Lucide icons for dynamically added elements
  lucide.createIcons();
  
  $messages.scrollTop = $messages.scrollHeight;
  return body;
}

function appendSources(hits) {
  if (!hits || !hits.length) return;
  const wrap = document.createElement("div");
  wrap.className = "text-xs text-slate-400 mt-2 p-3 bg-slate-950/60 border border-slate-800 rounded-xl space-y-1.5 max-w-[90%]";
  
  const title = document.createElement("div");
  title.className = "font-medium text-slate-300 flex items-center gap-1.5 mb-1";
  title.innerHTML = `<i data-lucide="layers" class="w-3.5 h-3.5 text-indigo-400"></i> Referenced Sources:`;
  wrap.appendChild(title);

  hits.forEach(h => {
    const chip = document.createElement("div");
    chip.className = "inline-flex items-center gap-2 bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-md text-[11px] mr-1.5 mb-1 font-mono text-slate-300";
    chip.innerHTML = `<span class="text-indigo-400">${h.filename}</span> <span class="text-slate-600">•</span> chunk ${h.chunk_index} <span class="text-slate-600">•</span> score ${h.score}`;
    wrap.appendChild(chip);
  });

  $messages.appendChild(wrap);
  lucide.createIcons();
  $messages.scrollTop = $messages.scrollHeight;
}

$form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = $input.value.trim();
  if (!message) return;
  $input.value = "";
  $sendBtn.disabled = true;

  appendMessage("user", message);
  const replyBody = appendMessage("assistant", "");

  let assistantText = "";
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, history }),
    });
    if (!res.ok || !res.body) {
      replyBody.textContent = `[error] HTTP ${res.status}`;
      return;
    }

    // ---- SSE parsing on the client side ------------------------------
    // The server emits frames like:  event: token\ndata: {...}\n\n
    // A single reader.read() can return a partial frame, half a frame
    // plus the start of the next, etc. — so we buffer until we see the
    // \n\n that terminates a frame, then split off complete frames.
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let sep;
      while ((sep = buf.indexOf("\n\n")) !== -1) {
        const frame = buf.slice(0, sep);
        buf = buf.slice(sep + 2);
        const lines = frame.split("\n");
        let event = "message", data = "";
        for (const line of lines) {
          if (line.startsWith("event: ")) event = line.slice(7);
          else if (line.startsWith("data: ")) data = line.slice(6);
        }
        let payload = {};
        try { payload = JSON.parse(data); } catch {}
        if (event === "token") {
          assistantText += payload.text || "";
          replyBody.textContent = assistantText;
          $messages.scrollTop = $messages.scrollHeight;
        } else if (event === "sources") {
          appendSources(payload.hits);
        } else if (event === "error") {
          replyBody.textContent = "[error] " + (payload.message || "unknown");
        } else if (event === "done") {
          // nothing — natural end of stream
        }
      }
    }
  } catch (err) {
    replyBody.textContent = "[error] " + err.message;
  } finally {
    if (assistantText) {
      history.push({ role: "user", content: message });
      history.push({ role: "assistant", content: assistantText });
    }
    $sendBtn.disabled = false;
    $input.focus();
  }
});

// ---- Upload --------------------------------------------------------
const $uploadForm   = document.getElementById("upload-form");
const $uploadInput  = document.getElementById("upload-input");
const $uploadBtn    = document.getElementById("upload-btn");
const $uploadStatus = document.getElementById("upload-status");

$uploadForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const file = $uploadInput.files[0];
  if (!file) return;
  const data = new FormData();
  data.append("file", file);
  $uploadBtn.disabled = true;
  $uploadStatus.textContent = `Uploading ${file.name}...`;
  try {
    const res = await fetch("/api/upload", { method: "POST", body: data });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      $uploadStatus.textContent = `[error] ${body.detail || res.status}`;
    } else {
      $uploadStatus.textContent =
        `Ingested ${body.filename} (${body.bytes} bytes). Now searchable.`;
      $uploadInput.value = "";
    }
  } catch (err) {
    $uploadStatus.textContent = "[error] " + err.message;
  } finally {
    $uploadBtn.disabled = false;
  }
});
</script>
</body>
</html>
